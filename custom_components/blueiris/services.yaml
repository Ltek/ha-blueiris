trigger_camera:
  name: Trigger Camera
  description: Triggers a camera
  target:
    entity:
      integration: blueiris
      domain: camera

current_camera_snapshot:
  name: Current Camera Snapshot
  description: >-
    Saves the camera's current still image to the local media folder
    (media/blueiris) and returns its path and a /media/local URL.
  target:
    entity:
      integration: blueiris
      domain: camera
  fields:
    filename:
      name: File name
      description: Optional file name; defaults to <camera id>_current.jpg
      required: false
      example: "driveway_frozen.jpg"
      selector:
        text:

move_to_preset:
  name: Move to Preset
  description: Moves the selected camera to the specified preset
  target:
    entity:
      integration: blueiris
      domain: camera
  fields:
    preset:
      name: Preset
      description: Desired preset
      required: true
      example: "1"
      default: "1"
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
            - "8"
